site_name: GlassineOS
site_description: A Linux distribution for Boox e-ink tablets, built on Alpine Linux.
site_url: https://docs.glassine.org/
repo_url: https://github.com/GlassineOS/docs
repo_name: GlassineOS/docs
edit_uri: edit/main/docs/
copyright: Text CC-BY-SA-4.0 · GlassineOS is not affiliated with Onyx International.

theme:
  name: material
  # Three voices (White, Editorial, Stationery), each with three pens, in three
  # schemes; the reader picks them in the header's Appearance panel. All values come
  # from theme/tokens.json (hooks/tokens.py turns them into CSS variables). Templates
  # and styles live in overrides/ and docs/assets/.
  custom_dir: overrides
  # Fonts are self-hosted (docs/assets/fonts): no requests to Google Fonts.
  font: false
  language: en
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - search.suggest
    - content.code.copy
  # Three schemes, the Scheme row of the Appearance panel. The first option whose
  # media query matches is the default: E-ink on slow-refresh screens, otherwise the
  # system light/dark setting. The E-ink scheme is greys only, with no colour
  # dependence.
  palette:
    - scheme: paper
      label: Paper
      media: "(prefers-color-scheme: light) and (not (update: slow))"
      primary: custom
      accent: custom
    - scheme: night
      label: Night
      media: "(prefers-color-scheme: dark) and (not (update: slow))"
      primary: custom
      accent: custom
    - scheme: eink
      label: E-ink
      media: "(update: slow)"
      primary: custom
      accent: custom

extra_css:
  - assets/stylesheets/fonts.css
  - assets/stylesheets/tokens.css
  - assets/stylesheets/glassine.css
  - assets/stylesheets/voices.css

extra_javascript:
  - assets/javascripts/glassine.js

hooks:
  - hooks/tokens.py

plugins:
  # The theme's search must stay first: the semantic search hooks into its search box.
  - search
  - glassine-search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.mark
  - tables
  - toc:
      permalink: true
      title: On this page
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Devices:
      - devices/index.md
      - Onyx Boox Note Air: devices/onyx-noteair/index.md
  - Guides:
      - guides/index.md
      - guides/qualcomm-boot-and-edl.md
      - guides/ab-on-single-slot.md
      - guides/mainline-bring-up.md
      - guides/boox-firmware.md
  - Architecture:
      - architecture/index.md
      - architecture/boot-flow.md
      - architecture/root-and-deployments.md
      - architecture/eink-engine.md
      - architecture/cpu-gpu.md
      - architecture/search.md
  - Decisions:
      - decisions/index.md
      - decisions/0001-independent-alpine-distribution.md
      - decisions/0002-licenses.md
      - decisions/0003-contribution-model.md
      - decisions/0004-domain-and-ids.md
      - decisions/0005-versioning.md
      - decisions/0006-data-encryption.md
      - decisions/0007-recovery-mainline-twrp.md
      - decisions/0008-bring-your-own-stock-kernel.md
      - decisions/0009-specs-and-acceptance.md
      - decisions/0010-root-and-deployments.md
      - decisions/0011-semantic-search.md
  - Dead ends: dead-ends/index.md
  - Contributing:
      - contributing/writing-docs.md

strict: true
