name: docs
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # GlassineOS/search, pinned by full commit. Models come from its release models-1.
  GLASSINE_SEARCH_REF: 221823eee44851a8df644cea97e8dfc26a30cc95
  NO_MKDOCS_2_WARNING: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-search.txt
      # Model files change only with the search package; embeddings are keyed by chunk
      # text and model, so every build restores the newest set and saves its own.
      - uses: actions/cache@v6
        with:
          path: .cache/glassine-search/models
          key: search-models-${{ env.GLASSINE_SEARCH_REF }}
          restore-keys: search-models-
      - uses: actions/cache@v6
        with:
          path: .cache/glassine-search/embeddings
          key: search-embeddings-${{ env.GLASSINE_SEARCH_REF }}-${{ github.sha }}
          restore-keys: |
            search-embeddings-${{ env.GLASSINE_SEARCH_REF }}-
            search-embeddings-
      # Other repositories' documentation folders, fetched by commit (the folder name holds
      # the commit, so a pin that moves fetches only what changed).
      - uses: actions/cache@v6
        with:
          path: .cache/glassine-search/sources
          key: search-sources-${{ hashFiles('search-sources.toml') }}
          restore-keys: search-sources-
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request' && !github.event.repository.private
        with:
          path: site

  # Pages for private repositories needs a paid plan: deploy starts once the repo is public.
  deploy:
    needs: build
    if: github.event_name != 'pull_request' && !github.event.repository.private
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
